{"name": "Quandrix Unlimited — X Marks the Math", "slug": "quandrix-unlimited", "sub": "100 cards · 37 lands · v3 upgrade sweep of the Secrets of Strixhaven precon · Bracket 3 (2 Game Changers)", "revnote": "v3 (2026-11-10, accepted, build in progress): 14 swaps. Untapped G/U duals for slow lands, Birds/Farseek for scaling rocks, 3 counterspells + Cyclonic Rift + Heroic Intervention for soft interaction, Ouroboroid/Doubling Season/Walking Ballista/Nature's Rhythm for filler. GC 0 → 2.", "hint": "Zimone discounts your FIRST X spell each turn by {1} per counter on her, then grows +2 for casting it. Every counter multiplier compounds the discount; Doubling Season doubles the lot. The deck is one big feedback loop.", "manaNote": "Demand is close to even between green and blue, green slightly ahead. Most costs here are mostly X (colorless), so TOTAL lands matter more than color. Play every land you draw; grab green first when you have the choice (the ramp spells cost G), then keep {U}{U} open for Counterspell once the board is worth protecting.", "gameplan": {"plan": "Cast one discounted X-spell per turn — Zimone grows every time, making the next one cheaper. Multiply +1/+1 counters, cash big X into hydras and card draw.", "mull": "3 lands, or 2 plus ramp. One X-spell in hand is plenty (they're blanks early); two or more, ship it.", "early": "Ramp (Birds, Farseek, Nature's Lore), Zimone on 3, then a counter-multiplier: Hardened Scales, Ozolith, Kami, or Doubling Season on 5.", "mid": "Hit the cadence every turn — biggest X you can. Instant-speed X (Pull from Tomorrow) or Alchemist's Refuge lets you hit it on opponents' turns too.", "win": "Tanazir makes the team his size · Ouroboroid grows every creature each combat · Primo's fractal spiral doubles each combat · Biomass Mutation ends it (but SETS base power, turns Primo off) · Walking Ballista pings out the last points · Rogue's Passage + one giant hydra.", "fear": "Wipes and removal on Zimone. Keep Fierce Guardianship (free while Zimone is out) or {U}{U} for Counterspell once the board is tall; Heroic Intervention covers destroy-wipes. Don't dump every X payoff into one board state."}, "clusters": [{"k": "firstx", "label": "X-spell cadence", "blurb": "one discounted X spell per turn — make it count", "how": "Zimone's discount and growth, Owlin Spiralmancer's copy, Nev's counters, Lattice Library's Fractal, and Brass Infiniscope's rider ALL key off 'your first spell with {X} in its mana cost each turn.' One cast, five payoffs — but only the first each turn.", "ex": "Zimone at 6 counters: cast Hydroid Krasis for X=9, paying {3} less than the mana you spent — Owlin copies it (another 9/9 flier + trigger), Nev gets 9 counters, Zimone grows to 8+. Next turn's X spell is cheaper again.", "why": "Cadence engines meter value per turn, not per card — instant-speed X spells and Alchemist's Refuge let you hit the cadence on opponents' turns too, doubling the engine."}, {"k": "scale", "label": "Counter multiplication", "blurb": "replacement effects stack: +2 becomes +6", "how": "Hardened Scales, Ozolith the Shattered Spire, Kami of Whispered Hopes, Benevolent Hydra, and Doubling Season are all REPLACEMENT effects that apply to the same counter event, one after another. The +1s add; Doubling Season doubles. You choose the order on your own permanents: add first, double last.", "ex": "Zimone triggers for +2. Scales makes it 3, Ozolith 4, Kami 5, Benevolent Hydra 6, then Doubling Season makes it 12. Ouroboroid puts its power in counters on every creature each combat, and each of those events gets the same treatment.", "why": "Evaluate engine pieces by what they multiply: a 1-mana enchantment that upgrades every counter event in a 40-counter game is worth more than a big one-shot."}, {"k": "xmana", "label": "X-mana engine", "blurb": "mana IS card text in an X deck", "how": "Kami taps for mana equal to its own power (and it grows). Elementalist's Palette banks two charges per X spell and pays them all back. Troyan taps for {G}{U} restricted to X/5+ spells. Birds, Farseek and the land sorceries get you there early.", "ex": "Turn 7: Palette at 6 charges + Kami at 5 power + 7 lands = X=14 Pull from Tomorrow. Every extra mana source re-sizes every X card still in your hand.", "why": "X decks break the usual ramp quota on purpose — ramp isn't a means to cast your spells, it IS the size of your spells."}, {"k": "fractal", "label": "Fractal factory", "blurb": "0/0 BASE power is a feature, not a bug", "how": "Fractal tokens are base 0/0. Counters make them huge but their BASE power stays 0. Primo triggers on 'creatures with base power 0 dealing combat damage': each hit creates a new Fractal sized by the damage. Lattice Library mints one per first X spell; Doubling Season makes two. Careful: Biomass Mutation SETS base power, turning Primo off.", "ex": "A 12/12 Fractal (base 0/0) connects: Primo makes a new Fractal with 12 counters. Two Fractals hit next turn — the board doubles every combat.", "why": "Rules precision opens synergies: 'base power' vs. 'power' looks like trivia until it's the difference between one token and an army."}, {"k": "payload", "label": "X payloads", "blurb": "hydras with riders — size plus card advantage", "how": "Every X creature carries a rider so the mana buys more than stats: Goldvein leaves X Treasures when it dies, Lifeblood draws X, The Goose Mother banks Food for draws, Kinetic Ooze removes a permanent (and doubles counters at X≥10), Hangarback leaves Thopters, Walking Ballista turns counters into damage. Stonecoil's protection makes it the safest counter home. Never tutor them with Nature's Rhythm: they'd enter at X=0.", "ex": "Goldvein Hydra X=8 attacks with haste; if they kill it, you bank 8 Treasures — which pay for the next X spell and trigger the cadence again.", "why": "In big-mana decks, pick payoffs that convert size into CARDS when answered — that's how you lose a creature without losing a turn."}, {"k": "draw", "label": "X-draw refills", "blurb": "late-game mana becomes a fresh hand", "how": "Pull from Tomorrow, Stroke of Genius, and Commander's Insight convert spare mana to cards at instant speed (all trigger the cadence cluster). Ingenious Prodigy and Lifeblood Hydra draw off their counters; Reliquary Tower and Study Hall keep the haul.", "ex": "End of an opponent's turn: Pull from Tomorrow X=9 — nine cards, cadence triggered on their turn, your own turn's first-X discount still unused.", "why": "Engine decks stall when the hand empties; X draw is the perfect refill because it scales with exactly the resource you've been hoarding."}, {"k": "protect", "label": "Engine protection", "blurb": "the counters live on permanents — guard them", "how": "All the deck's value is stored in +1/+1 counters on the board, so wipes hurt double. Counterspell, Arcane Denial and Fierce Guardianship (free while Zimone is out) stop wipes on the stack; Heroic Intervention saves the whole board from destroy effects; Guardian Augmenter (flash) gives commanders hexproof; Silkguard and Tyvar's Stand save key creatures; Cyclonic Rift resets their board instead.", "ex": "Opponent casts a wrath with your board at 40 counters: Fierce Guardianship for free. No Guardianship? Heroic Intervention in response and everything survives.", "why": "Counter decks bank value on the battlefield rather than in hand — budget protection slots the way spellslinger decks budget counterspells."}], "lands": {"title": "Lands ×37", "desc": "7 Island · 6 Forest · 24 nonbasic. v3 swapped three slow/colorless lands for untapped G/U duals. Opal Palace, Study Hall, Alchemist's Refuge, Rogue's Passage shown in their synergy groups.", "cards": [{"n": "Breeding Pool", "tip": "Pay 2 life to enter untapped; Farseek, Nature's Lore and Three Visits can all fetch it", "new": true}, {"n": "Command Tower"}, {"n": "Exotic Orchard"}, {"n": "Fabled Passage", "tip": "Fetch: grab the color you're missing"}, {"n": "Flooded Grove", "tip": "Filter into GG /
