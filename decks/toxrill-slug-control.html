<script type="application/json" id="deck-data">
{"name": "Gary the Strong — Toxrill Slug Control", "slug": "toxrill-slug-control", "sub": "38 lands · avg MV ~3.3 · Bracket 3 (1 Game Changer: Rhystic Study)", "revnote": "2026-11-15 post-con rebuild: the box lost its drain finish (Konrad, Deluge, Skullclamp, Bastion, Sheoldred's Edict gone). Diff is vs. the physical box: in come the owned library pulls (Grave Pact, Scarab God, Grave Titan, Yahenni, Ashnod's Altar, Snuff Out, Black Sun's Zenith...) plus 2 buys (Skullclamp, Falkenrath Noble); Gray Merchant, Massacre Wurm, Night's Whisper and Go for the Throat are back from Sifa. Basics 13/8 → 10/10.", "manaNote": "Black is the main color now: Grave Pact and Massacre Wurm want BBB and Toxrill BB, so aim for three black sources by turn 5. Blue is for counters and draw; one or two blue sources is enough early. You need a Swamp out to cast Snuff Out for free.", "hint": "Toxrill puts a slime counter on every enemy creature each end step, and they get -1/-1 for EACH counter. The board melts a little faster every turn. Every other card here speeds up the melt or cashes in the corpses, and with Grave Pact every Slug you sacrifice makes each opponent sacrifice a creature.", "gameplan": {"plan": "Survive to seven mana, land Toxrill, and let the table melt one -1/-1 at a time. Every enemy death gives you Slugs, cards and drain. Once Grave Pact is out, every Slug you sacrifice makes each opponent sacrifice a creature too. If Toxrill gets exiled, The Scarab God, Grave Titan, Gray Merchant and the X-spells still win.", "mull": "3+ lands, an early draw spell or Rhystic/Arena, and one answer. Sol Ring or a rock means keep. This deck loves slow hands: be greedy for lands, not action.", "early": "Rocks and card engines (Rhystic Study, Phyrexian Arena, Baleful Strix). Hold counters; spot-kill or wipe only if aggro forces it.", "mid": "Reset with Damnation or Black Sun's Zenith if you need to, then cast Toxrill with a counter up (Swan Song, Counterspell, Disallow). After he resolves, Snuff Out and Deadly Rollick are free, so you can tap out for Grave Pact or a proliferate turn.", "win": "Grave Pact + a sac outlet (Ashnod's Altar, Yahenni, Toxrill's own draw) empties every opponent's board · Exsanguinate / Torment of Hailfire off a Black Market bank · The Scarab God upkeep drain with Grave Titan's Zombies · Gray Merchant · Blood Artist / Falkenrath Noble / Massacre Wurm pings on every death.", "fear": "Toxrill draws every kill spell at the table: keep boots, Greaves or Malakir Rebirth ready, and protect the cast with real counters. Graveyard hate blanks Primordial and Scarab God; enchantment removal on Grave Pact slows the lock. Your own Black Sun's Zenith kills Toxrill at X 7 or more."}, "clusters": [{"k": "slime", "label": "The melt clock", "blurb": "proliferate makes the -1/-1s arrive faster", "how": "Toxrill's counters stack: one end step under him every enemy creature has -1/-1, then -2/-2, then -3/-3. Proliferate adds another counter to everything that already has one, so it speeds the clock up. Your proliferate: Flux Channeler (every noncreature spell you cast), Tezzeret's Gambit, Contagion Engine (proliferate twice, every turn) and Deepglow Skate (doubles counters). Proliferate lets you choose, so pick only enemy creatures. Sludge Monster's counters are also called slime, so Toxrill reads them too. Black Sun's Zenith and Contagion Engine put -1/-1 counters down that proliferate grows the same way.", "ex": "End step: everyone's creatures get counter #2. On your turn Deepglow Skate doubles all the slime, so it's -4/-4. Most of the table's creatures die at once, each one gives you a Slug, and Massacre Girl draws you a card per death.", "why": "Counter names are rules text: two cards that use the same counter name power each other up. Read the counter, not just the effect."}, {"k": "slugs", "label": "Slug economy & Grave Pact", "blurb": "their dead board turns into your cards, mana and edicts", "how": "Every enemy creature that dies with slime on it becomes a 1/1 Slug for you. Toxrill turns Slugs into cards ({U}{B}, sacrifice a Slug: draw). GRAVE PACT closes the loop: a sacrificed Slug is a creature you control dying, so each other player sacrifices a creature. If theirs had slime on it (almost all do after one end step), you get a new Slug. Free sac outlets make it run without {U}{B}: Ashnod's Altar (sacrifice for {C}{C}) and Yahenni (sacrifice for indestructible). Skullclamp kills a Slug for {1} and draws 2. Deadly Dispute sacrifices one at instant speed. Black Market banks a {B} for every death, Morbid Opportunist draws once a turn.", "ex": "Toxrill + Grave Pact + Ashnod's Altar, 3 Slugs: sacrifice a Slug to the Altar ({C}{C}), each opponent sacrifices a slimed creature, you get 3 new Slugs. Keep going until their boards are empty, then spend the colorless mana on Exsanguinate. Blood Artist and Falkenrath Noble drain on every death.", "why": "A sacrifice outlet plus a 'when yours dies' payoff turns a self-replacing token into repeatable removal. It ends when their creatures run out, so it's a lock, not an infinite combo."}, {"k": "drain", "label": "Death drain & finishers", "blurb": "every death pings, and the closers don't need Toxrill", "how": "Blood Artist and Falkenrath Noble drain 1 on any creature death. Massacre Wurm makes each opponent lose 2 per creature of theirs that dies while it lives. Toxrill and Grave Pact kill something every turn, so these trigger constantly. To finish: Gray Merchant drains your devotion to black, The Scarab God drains each upkeep per Zombie (Grave Titan makes Zombies, so does Scarab God), and Exsanguinate or Torment of Hailfire turn a Black Market bank into a lethal X.", "ex": "Damnation with Blood Artist and Falkenrath Noble out: 8 creatures die, so 16 drain triggers you split across the table before you untap. Next turn Gray Merchant at devotion 8 ends someone.", "why": "A commander deck needs at least two ways to win that survive the commander being exiled. Passive drain makes every wipe a burn spell too."}, {"k": "wipes", "label": "Reset buttons", "blurb": "wipes that are one-sided in practice", "how": "Damnation is the clean reset. Black Sun's Zenith puts -1/-1 counters on everything, which proliferate then grows on their side only. Contagion Engine puts a -1/-1 counter on every creature one player controls. Massacre Wurm shrinks only their side. Polymorphist's Jest is secretly a wipe: their board becomes 1/1 Frogs, so one slime counter kills them all. You lose 1/1 Slugs that Toxrill makes again; they lose real cards. Wipes that shrink toughness (Zenith, Wurm, Jest, Engine) draw off Massacre Girl; Damnation doesn't.", "ex": "An opponent goes wide: Jest their board in response to Toxrill's end-step trigger. The trigger puts slime on the 1/1 Frogs, they all die, and you get that many Slugs.", "why": "Judge symmetric effects by what each side rebuilds with. The card is symmetric, the table isn't."}, {"k": "protect", "label": "Counter wall & free answers", "blurb": "protect Toxrill and the key turn", "how": "Counterspell, Arcane Denial, Swan Song, An Offer You Can't Refuse, Disallow and Mystic Confluence handle the turn you cast Toxrill. Two answers cost no mana: Snuff Out (pay 4 life if you control a Swamp; nonblack creature) and Deadly Rollick (free while you control your commander; exile any creature). So you can tap out and still have removal. Go for the Throat, Infernal Grasp and Reality Shift are the cheap spot removal; Boots, Greaves and Malakir Rebirth keep him alive.", "ex": "You tap out for Toxrill on 7 with Swan Song up. Next turn someone casts a big threat: Deadly Rollick exiles it for nothing, and Snuff Out handles the next one for 4 life. All your mana stays open for counters.", "why": "A 7-mana commander is a 7-mana question. Budget interaction for the turn you tap out, then prefer free spells."}, {"k": "value", "label": "Card draw engines", "blurb": "taxes early, death-draws late", "how": "Early: Rhystic Study taxes every opponent's spell, Phyrexian Arena draws every upkeep, Night's Whisper and Read the Bones refill. Late: MASSACRE GIRL draws whenever an opponent's creature dies with toughness below 1, which is exactly how Toxrill kills (his -1/-1s drop toughness to 0). Slime, Massacre Wurm, Black Sun's Zenith, Contagion Engine and Jest+slime all count; destroy, edicts and Grave Pact sacrifices don't. Morbid Opportunist draws once per turn off any death, Skullclamp turns each Slug into 2 cards, and Rune-Scarred Demon finds whatever piece you're missing.", "ex": "Toxrill's end-step counter kills three X/1s: Massacre Girl draws 3, Morbid Opportunist draws 1, and Toxrill makes 3 Slugs to sacrifice for more.", "why": "In a slow control deck, the early game is won by drawing more than everyone else. Late, make the board-melt itself refill your hand."}, {"k": "steal", "label": "Their graveyards, your army", "blurb": "the graveyards you filled are a toolbox", "how": "All those wipes and edicts fill graveyards. Sepulchral Primordial returns a creature from EACH opponent's graveyard onto your battlefield. The Scarab God ({2}{U}{B}) exiles a creature card from any graveyard and makes a 4/4 Zombie copy of it, and every Zombie adds to its upkeep drain. When Scarab God dies it goes back to your hand.", "ex": "After two wipes, The Scarab God copies the table's best dead creature each turn as a 4/4 Zombie. With Grave Titan's two Zombies out, that's 4+ life from each opponent every upkeep.", "why": "Graveyards are a shared resource. Decks that fill them should also be the decks that shop there."}], "groups": [{"title": "Command zone & melt engine", "desc": "The inevitability core: counters stack, boards dissolve", "cards": [{"n": "Toxrill, the Corrosive", "mv": 7, "tags": "slime slugs", "tip": "Slime counter on every enemy creature each end step; they get -1/-1 per counter; their slimed deaths = your Slugs; {U}{B}, sacrifice a Slug: draw", "cmdr": true, "print": "sld/1929"}, {"n": "Sludge Monster", "mv": 5, "tags": "slime", "tip": "Its slime counters feed Toxrill's -1/-1 too, and turn the target into a vanilla 2/2"}, {"n": "Deepglow Skate", "mv": 5, "tags": "slime", "tip": "ETB: doubles every counter on the permanents you pick. Pick enemy creatures with slime and most of the table dies"}, {"n": "Tezzeret's Gambit", "mv": 4, "tags": "slime value", "tip": "Draw 2 + proliferate (pay 2 life instead of {U})"}, {"n": "Flux Channeler", "mv": 3, "tags": "slime", "tip": "Proliferates every time you cast a noncreature spell, and that's most of this deck"}, {"n": "Contagion Engine", "mv": 6, "tags": "slime wipes", "tip": "ETB: -1/-1 counter on each creature one player controls. Then {4},{T}: proliferate twice, every turn", "new": true, "guide": [{"when": "Default ETB target", "get": null, "why": "The opponent with the most small creatures, or whose board already has slime. The -1/-1 counter stacks with Toxrill's static, so X/1s and slimed creatures die now and give you Slugs"}, {"when": "Massacre Girl is out", "get": "Massacre Girl, Known Killer", "why": "Every creature dropped to 0 toughness draws you a card, so aim at the widest board"}, {"when": "Never target yourself", "get": null, "why": "Your 1/1 Slugs (and Blood Artist) die to it"}, {"when": "Later turns: activate", "get": "Toxrill, the Corrosive", "why": "{4},{T}: proliferate twice = two extra slime counters on every enemy creature. Pick only enemy creatures (and Midnight Clock if you want the refill sooner)"}]}]}, {"title": "Slug economy & death engine", "desc": "Corpses in, cards, mana and edicts out", "cards": [{"n": "Grave Pact", "mv": 4, "tags": "slugs wipes", "tip": "Whenever a creature you control dies, each other player sacrifices a creature. Every Slug you sacrifice is an edict, and their slimed creature comes back to you as a new Slug", "new": true}, {"n": "Ashnod's Altar", "mv": 3, "tags": "slugs", "tip": "Sacrifice outlet: sacrifice a creature, add {C}{C}. Instant speed, no mana needed. With Grave Pact each Slug = edict + 2 mana toward Exsanguinate or Torment", "new": true}, {"n": "Yahenni, Undying Partisan", "mv": 3, "tags": "slugs", "tip": "Free sac outlet (sacrifice another creature: indestructible), haste, and +1/+1 counter whenever an opponent's creature dies. Survives your own wipes if you feed it a Slug", "new": true}, {"n": "Skullclamp", "mv": 1, "tags": "slugs value", "tip": "Equip {1} to a 1/1 Slug: +1/-1 kills it, you draw 2, and Grave Pact makes everyone sacrifice. Repeat each Slug. (Buy pending)", "new": true}, {"n": "Deadly Dispute", "mv": 2, "tags": "slugs value", "tip": "2-mana instant: sacrifice a Slug (or an artifact), draw 2 and make a Treasure. Triggers Grave Pact", "new": true}, {"n": "Morbid Opportunist", "mv": 3, "tags": "slugs value", "tip": "Draws a card the first time other creatures die each turn (anyone's, any turn)", "new": true}, {"n": "Blood Artist", "mv": 2, "tags": "slugs drain", "tip": "Whenever it or another creature dies: target player loses 1, you gain 1"}, {"n": "Falkenrath Noble", "mv": 4, "tags": "slugs drain", "tip": "Flier. Whenever it or another creature dies: target player loses 1, you gain 1. A second Blood Artist for the melt. (Buy pending)", "new": true}, {"n": "Black Market", "mv": 5, "tags": "slugs drain", "tip": "Charge counter per creature death; adds that much {B} at your first main phase, every turn. Pays for Torment/Exsanguinate"}]}, {"title": "Board control", "desc": "Wipes and removal that leave something behind on your side", "cards": [{"n": "Damnation", "mv": 4, "tags": "wipes", "tip": "Clean destroy-all reset. Cast it BEFORE Toxrill, or accept recasting him"}, {"n": "Black Sun's Zenith", "mv": "X+2", "tags": "wipes slime", "tip": "X -1/-1 counters on EVERY creature (yours too), then it shuffles back into your library. Proliferate grows the counters on theirs only", "new": true, "guide": [{"when": "Before Toxrill", "get": null, "why": "Pick X = the toughness you need gone. Your board is mostly cheap creatures anyway"}, {"when": "Toxrill out", "get": "Toxrill, the Corrosive", "why": "Their creatures are already shrunk by slime, so a small X finishes them. He's 7/7: keep X at 6 or less and he lives (your Slugs die, which is fine with Grave Pact out)"}, {"when": "Proliferate in play", "get": "Flux Channeler", "why": "Cast a small X, then proliferate only enemy creatures. Flux, Skate, Contagion Engine and Gambit all add to their -1/-1 pile"}, {"when": "Massacre Girl out", "get": "Massacre Girl, Known Killer", "why": "Counters kill by toughness, so every enemy death draws you a card"}]}, {"n": "Polymorphist's Jest", "mv": 3, "tags": "wipes", "tip": "Their board becomes 1/1 Frogs with no abilities until end of turn; one slime counter finishes them. A secret wipe", "guide": [{"when": "Target", "get": null, "why": "The opponent with the biggest board, or the one about to swing at you"}, {"when": "Best timing", "get": "Toxrill, the Corrosive", "why": "In response to Toxrill's end-step trigger: the Frogs get slime and die, and you get a Slug each. Anything that already had slime dies right away"}, {"when": "Combat trick", "get": null, "why": "Mid-combat it turns their attackers into 1/1s with no abilities, a blowout against one big threat"}]}, {"n": "Massacre Wurm", "mv": 6, "tags": "wipes drain", "tip": "ETB: their creatures get -2/-2 until end of turn. Then each opponent loses 2 whenever one of their creatures dies, for as long as it lives"}, {"n": "Go for the Throat", "mv": 2, "tags": "protect", "tip": "2-mana instant kill (not artifact creatures)"}, {"n": "Infernal Grasp", "mv": 2, "tags": "protect", "tip": "2-mana instant: destroy any creature, you lose 2 life", "new": true}, {"n": "Snuff Out", "mv": 4, "tags": "protect", "tip": "FREE with a Swamp out (pay 4 life): destroy a nonblack creature. Your answer on the turn you tap out for Toxrill", "new": true}, {"n": "Deadly Rollick", "mv": 4, "tags": "protect", "tip": "FREE while you control your commander: exile : "Phyrexian Arena", "mv": 3, "tags": "value", "tip": "Extra card every upkeep for 1 life", "new": true}, {"n": "Massacre Girl, Known Killer", "mv": 4, "tags": "slime value", "tip": "Draws whenever an enemy creature dies with toughness below 1. Slime, Wurm, Zenith and Contagion Engine count; destroy and sacrifice don't. Gives your Slugs wither", "new": true}, {"n": "Rune-Scarred Demon", "mv": 7, "tags": "value", "tip": "7-mana 6/6 flier that tutors ANY card on entering", "new": true, "guide": [{"when": "Toxrill is out, no lock yet", "get": "Grave Pact", "why": "Turns every Slug into an edict. With Ashnod's Altar or Yahenni the table's boards disappear"}, {"when": "Behind on board, Toxrill not out", "get": "Damnation", "why": "Reset first, then land Toxrill on an empty table"}, {"when": "Opponents low and you have mana", "get": "Exsanguinate", "why": "Or Torment of Hailfire. With Black Market charged, X is large enough to end the game"}, {"when": "Melt too slow", "get": "Deepglow Skate", "why": "Doubles every slime counter at once; Contagion Engine is the slower, repeatable option"}, {"when": "Need to protect a key turn", "get": "Counterspell", "why": "Or Disallow if the threat is an ability"}, {"when": "Low on cards", "get": "Phyrexian Arena", "why": "Long-game engine; Rhystic Study if the table is casting a lot"}]}, {"n": "Baleful Strix", "mv": 2, "tags": "value protect", "tip": "Cantrip flying deathtouch blocker"}, {"n": "Night's Whisper", "mv": 2, "tags": "value", "tip": "Draw 2, lose 2 life"}, {"n": "Read the Bones", "mv": 3, "tags": "value", "tip": "Scry 2, draw 2, lose 2 life. Digs for Toxrill's answers or a wipe", "new": true}, {"n": "Deep Analysis", "mv": 4, "tags": "value", "tip": "Draw 2, then flash it back for {1}{U} and 3 life for 2 more", "new": true}, {"n": "Brainstorm", "mv": 1, "tags": "value", "tip": "Draw 3, put 2 back. Best after a shuffle (Fabled Passage, Polluted Delta)"}, {"n": "Fact or Fiction", "mv": 4, "tags": "value steal", "tip": "Instant draw; the pile they bin also fills your graveyard"}, {"n": "Dig Through Time", "mv": 8, "tags": "value", "tip": "Delve: usually UU for the best two of the top seven"}]}, {"title": "Finishers that don't need Toxrill", "desc": "Win even if the commander gets exiled", "cards": [{"n": "The Scarab God", "mv": 5, "tags": "steal drain", "tip": "Upkeep: each opponent loses X (X = your Zombies). {2}{U}{B}: exile a creature card from ANY graveyard, make a 4/4 Zombie copy. Returns to hand when it dies", "new": true}, {"n": "Grave Titan", "mv": 6, "tags": "drain slugs", "tip": "Deathtouch 6/6; two 2/2 Zombies on entering and on each attack. Zombies feed Scarab God and Grave Pact", "new": true}, {"n": "Gray Merchant of Asphodel", "mv": 5, "tags": "drain", "tip": "ETB: each opponent loses X = your devotion to black (Toxrill, Grave Pact, Wurm and Titan add a lot of B pips)"}, {"n": "Sepulchral Primordial", "mv": 7, "tags": "steal", "tip": "ETB: for each opponent, put up to one creature card from their graveyard onto your battlefield"}, {"n": "Exsanguinate", "mv": "X+2", "tags": "drain", "tip": "Each opponent loses X; you gain that much. Black Market mana counts"}, {"n": "Torment of Hailfire", "mv": "X+2", "tags": "drain", "tip": "Repeat X times: each opponent loses 3 unless they sacrifice a nonland permanent or discard. X=10 off a Black Market bank ends the table"}]}, {"title": "Ramp & utility", "desc": "Reaching 7 mana on time, then keeping Toxrill alive", "cards": [{"n": "Sol Ring", "mv": 1, "tip": "Turn-1 Sol Ring = Toxrill on turn 5", "new": true}, {"n": "Arcane Signet", "mv": 2}, {"n": "Dimir Signet", "mv": 2}, {"n": "Talisman of Dominance", "mv": 2}, {"n": "Fellwar Stone", "mv": 2}, {"n": "Mind Stone", "mv": 2}, {"n": "Thought Vessel", "mv": 2, "tip": "Rock + no maximum hand size, so the draw engines never discard"}, {"n": "Wayfarer's Bauble", "mv": 1, "tip": "Fetches a basic: fixes the Swamp count for Snuff Out and Grave Pact"}, {"n": "Skyclave Relic", "mv": 3}, {"n": "Sole
