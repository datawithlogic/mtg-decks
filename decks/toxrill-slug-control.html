<script type="application/json" id="deck-data">
{"name": "Gary the Strong — Toxrill Slug Control", "slug": "toxrill-slug-control", "sub": "100 cards · 38 lands · avg MV ~2.9 · Bracket 4 (4 Game Changers)", "revnote": "v2 + v3 accepted 2026-11-10 · build pending. Diff is vs. the physical (pre-v2) deck: v2 = rate upgrades + proliferate; v3 = Grave Pact death engine, Massacre Girl, Demonic Tutor, free interaction, Sol Ring. Lands 43 → 38.", "manaNote": "Blue early for counterspells and draw, but black is now the heavier color: Grave Pact wants BBB and Toxrill BB. Aim for three black sources by turn 5. Play Islands first, but never miss a Swamp drop.", "hint": "Toxrill puts a slime counter on every enemy creature each end step, and they get -1/-1 for EACH counter. The board melts a little faster every turn. Every other card here speeds up the melt or cashes in the corpses, and with Grave Pact every Slug you sacrifice makes each opponent sacrifice a creature.", "gameplan": {"plan": "Survive to seven mana, land Toxrill, and let the table melt one -1/-1 at a time. Every enemy death gives you Slugs, cards and drain triggers. Once Grave Pact is out, every Slug you sacrifice makes each opponent sacrifice a creature too.", "mull": "3+ lands, early draw (Remora, Arena, Night's Whisper, Strix) and one answer. Sol Ring or a rock means keep. Demonic Tutor counts as whatever the hand is missing. This deck loves slow hands: be greedy for lands, not action.", "early": "Rocks and card taxes (Remora, Rhystic, Arena). Hold counters; spot-kill or wipe only if aggro forces it.", "mid": "Reset the board if you need to, then cast Toxrill with protection up (Swan Song, Counterspell, Malakir Rebirth). Once he resolves, Fierce Guardianship and Deadly Rollick are free, so keep them for whatever targets him. Proliferate speeds up the melt.", "win": "Grave Pact + Slug sacrifices (Toxrill or Skullclamp) strips every opponent's board · Torment of Hailfire / Exsanguinate off a Black Market bank · Gray Merchant drain · Konrad/Blood Artist pings from every death.", "fear": "Toxrill attracts every kill spell at the table, so keep Rebirth/boots/Guardianship ready. Guardianship isn't free while Toxrill is still on the stack; protect the cast with real counters. Graveyard hate blanks Primordial; enchantment removal on Grave Pact slows the lock."}, "clusters": [{"k": "slime", "label": "The melt clock", "blurb": "proliferate makes the -1/-1s arrive faster", "how": "Toxrill's counters stack up: one end step under him everything has -1/-1, then -2/-2, then -3/-3. Proliferate adds another counter to everything that already has one, so it speeds up the clock. Your proliferate: Flux Channeler (every noncreature spell you cast), Tezzeret's Gambit, Karn's Bastion, Contagion Engine (proliferate twice, every turn), and Deepglow Skate (doubles them). Proliferate lets you choose, so only pick enemy creatures. Sludge Monster's counters are also called slime, so Toxrill's static reads them too. Massacre Girl gives your creatures wither, so even a Slug chump-block leaves -1/-1 counters that proliferate can grow.", "ex": "End step: everyone's creatures get counter #2. On your turn Deepglow Skate doubles all the slime, so it's -4/-4. Most of the table's creatures die at once, and each one gives you a Slug (plus a card each if Massacre Girl is out).", "why": "Counter names are rules text: two cards that use the same counter name power each other up. Read the counter, not just the effect."}, {"k": "slugs", "label": "Slug economy & Grave Pact", "blurb": "their dead board turns into your cards, mana and edicts", "how": "Every enemy creature that dies with slime on it becomes a 1/1 Slug for you. Toxrill turns Slugs into cards ({U}{B}, sacrifice a Slug: draw). Skullclamp makes a Slug die on equip (+1/-1), so that's 1 mana: draw 2. Black Market banks a black mana for every creature death, forever. GRAVE PACT closes the loop: a sacrificed Slug is a creature you control dying, so each opponent sacrifices a creature. If the creature they sacrifice had slime on it (almost all of them do after one end step), Toxrill gives you a new Slug. Every activation draws, strips a creature from every opponent, and refills itself. Morbid Opportunist adds a card once per turn.", "ex": "Toxrill + Grave Pact + Skullclamp out, 2 Slugs, 5 mana open: equip Clamp to a Slug (1), it dies → draw 2, each opponent sacrifices a slimed creature → you get 3 new Slugs. Equip again, repeat. Five mana strips five creatures from every opponent and draws you 10, and Blood Artist/Konrad ping on each death.", "why": "A sacrifice outlet plus a 'when yours dies' payoff turns a self-replacing token into removal you can repeat. The Slugs pay for the edicts and the edicts give the Slugs back."}, {"k": "drain", "label": "Death drain", "blurb": "every creature death pings the table", "how": "Syr Konrad damages each opponent whenever ANY other creature dies, not just yours. Blood Artist drains on every death. Massacre Wurm makes each opponent lose 2 per creature of theirs that dies. Toxrill kills things every turn and Grave Pact makes them sacrifice more, so these trigger constantly. Gray Merchant, Exsanguinate and Torment of Hailfire finish.", "ex": "Damnation with Konrad + Blood Artist out: 10 creatures die and each opponent takes about 10 before you untap. A follow-up Gray Merchant at devotion 6 ends someone.", "why": "Passive damage engines make your control cards do double duty: the wipe IS the burn spell."}, {"k": "wipes", "label": "Reset buttons", "blurb": "wipes that break symmetric — your Slugs regrow", "how": "Damnation, Toxic Deluge and an overloaded Cyclonic Rift reset the board. They're barely symmetric: you lose 1/1 Slugs that Toxrill makes again, they lose real cards. Contagion Engine puts a -1/-1 counter on every creature one player controls, and those counters add to slime. Polymorphist's Jest is secretly a wipe here: their board becomes 1/1 Frogs, so one slime counter kills a 1/1 (anything already slimed dies right away). Massacre Wurm does the same to small creatures and tokens. Wipes that shrink toughness (Deluge, Wurm, Jest, Engine) also draw off Massacre Girl. Damnation does not.", "ex": "An opponent goes wide: Jest their board in response to Toxrill's end-step trigger. The trigger puts slime on the 1/1 Frogs, they all die, and you get that many Slugs.", "why": "Judge symmetric effects by what each side rebuilds with. The card is symmetric, the table isn't."}, {"k": "protect", "label": "Counter wall", "blurb": "protect Toxrill and the key turn", "how": "Counterspell, Arcane Denial, Negate, Swan Song and An Offer You Can't Refuse handle the turn you cast Toxrill. Once he's on the battlefield, Fierce Guardianship (counter a noncreature spell) and Deadly Rollick (exile a creature) are FREE, since you control a commander, so you can tap out and still have answers. Go for the Throat, Infernal Grasp and Reality Shift are the cheap spot removal. Boots, Greaves and Malakir Rebirth keep him alive.", "ex": "You tap out for Toxrill on 7 with Swan Song up. Next turn someone points removal at him: Fierce Guardianship counters it for nothing, and Deadly Rollick exiles their best creature for nothing too. All your mana stays open.", "why": "A 7-mana commander is a 7-mana question. Budget interaction for the turn you tap out, then prefer free spells that switch on once he resolves."}, {"k": "value", "label": "Card draw engines", "blurb": "taxes early, death-draws late", "how": "Early: Rhystic Study and Mystic Remora tax every opponent's spells, Phyrexian Arena draws every upkeep, and Faerie Mastermind draws whenever an opponent draws their 2nd card in a turn. Late: MASSACRE GIRL draws a card whenever an opponent's creature dies with toughness below 1. That's exactly how Toxrill kills: his -1/-1s drop toughness to 0. Slime, Massacre Wurm, Toxic Deluge, Contagion Engine and Jest+slime all count. Destroy effects, edicts and Grave Pact sacrifices don't. Morbid Opportunist draws once per turn off any death.", "ex": "Toxrill's end-step counter kills three X/1s: Massacre Girl draws 3 (they died at toughness 0), Morbid Opportunist draws 1, and Toxrill makes 3 Slugs to sacrifice for more.", "why": "In a slow control deck, the early game is won by simply drawing more than everyone else. Late, make the board-melt itself refill your hand."}, {"k": "steal", "label": "Their stuff, your board", "blurb": "the graveyards you filled are a toolbox", "how": "All those wipes and edicts fill graveyards. Sepulchral Primordial returns the best creature from EACH opponent's graveyard onto your battlefield. Puppeteer Clique borrows one with haste, twice thanks to persist.", "ex": "After two board wipes, Sepulchral Primordial enters and brings three of the table's best dead creatures with it, onto your side.", "why": "Graveyards are a shared resource. Decks that fill them should also be the decks that shop there."}], "lands": {"title": "Lands ×38", "desc": "12 Island · 8 Swamp · 18 nonbasic. Trimmed from 43, since draw density and Sol Ring cover the drops.", "cards": [{"n": "Bojuka Bog", "tip": "Graveyard hate on a land, but it also hits YOUR Primordial targets"}, {"n": "Castle Vantress", "tip": "Repeatable scry 2, great in a long game"}, {"n": "Choked Estuary"}, {"n": "Command Tower"}, {"n": "Darkwater Catacombs"}, {"n": "Karn's Bastion", "new": true, "tags": "slime", "tip": "Proliferate on a LAND: the melt clock in your mana base"}, {"n": "Drowned Catacomb"}, {"n": "Exotic Orchard"}, {"n": "Fabled Passage"}, {"n": "Gloomlake Verge", "new": true, "tip": "Untapped U/B dual. Black needs an Island or Swamp (fetchable basics, Watery Grave)"}, {"n": "Morphic Pool"}, {"n": "Polluted Delta"}, {"n": "Shipwreck Marsh"}, {"n": "Sunken Hollow"}, {"n": "Tainted Isle"}, {"n": "Temple of Deceit"}, {"n": "Underground River"}, {"n": "Watery Grave"}, {"n": "Island", "count": 12}, {"n": "Swamp", "count": 8}]}, "pulled": {"title": "Pulled vs. the physical deck", "desc": "v2 rate upgrades + v3 death engine; lands 43 → 38", "cards": [{"n": "Aethersnipe", "tip": "v2: 6 mana for a bounce. Go for the Throat kills for 2"}, {"n": "Ornithopter of Paradise", "tip": "v2: Midnight Clock is much better"}, {"n": "Dimir Aqueduct", "tip": "v2: bounce-land tempo cost"}, {"n": "Myriad Landscape", "tip": "v2: slow colorless ramp. Karn's Bastion took the slot"}, {"n": "Evacuation", "tip": "v3: bounced your own Toxrill. Grave Pact"}, {"n": "Whelming Wave", "tip": "v3: bounced Toxrill too. Massacre Girl"}, {"n": "Grazilaxx, Illithid Scholar", "tip": "v3: combat-only draw. Contagion Engine"}, {"n": "Charix, the Raging Isle", "tip": "v3: a wall with no job. Morbid Opportunist"}, {"n": "Daze", "tip": "v3: Fierce Guardianship is a free hard counter once Toxrill is out"}, {"n": "Inevitable Betrayal", "tip": "v3: slow, and proliferate delayed it. Demonic Tutor"}, {"n": "Sudden Spoiling", "tip": "v3: Infernal Grasp, a clean 2-mana kill"}, {"n": "Force of Despair", "tip": "v3: narrow. Deadly Rollick is free exile with Toxrill out"}, {"n": "Whispersilk Cloak", "tip": "v3: third shroud piece. Phyrexian Arena"}, {"n": "Reliquary Tower", "tip": "v3: colorless land. Gloomlake Verge"}, {"n": "Thrummingbird", "tip": "v3: had to connect. Faerie Mastermind"}, {"n": "4 Island", "name": null, "tip": "3 in v2, 1 in v3 (for Sol Ring)"}]}, "groups": [{"title": "Command zone & melt engine", "desc": "The inevitability core: counters stack, boards dissolve", "cards": [{"n": "Toxrill, the Corrosive", "mv": 7, "cmdr": true, "tags": "slime slugs", "tip": "Slime every enemy creature each end step; -1/-1 per counter; their deaths = your Slugs; {U}{B}, sac a Slug: draw", "print": "sld/1929"}, {"n": "Sludge Monster", "mv": 5, "tags": "slime", "tip": "Its slime counters feed Toxrill's static AND make the target a vanilla 2/2"}, {"n": "Deepglow Skate", "mv": 5, "tags": "slime", "tip": "Doubles every counter on the permanents you pick, which usually wipes the table's boards"}, {"n": "Tezzeret's Gambit", "mv": 4, "tags": "slime value", "tip": "Draw 2 + proliferate (pay 2 life instead of {U})"}, {"n": "Flux Channeler", "mv": 2, "new": true, "tags": "slime", "tip": "Proliferates on EVERY noncreature spell you cast, and that's most of this deck"}, {"n": "Contagion Engine", "mv": 6, "new": true, "tags": "slime wipes", "tip": "ETB: -1/-1 counter on everything one player controls. Then {4},{T}: proliferate twice every turn", "guide": [{"when": "Default ETB target", "get": null, "why": "The opponent with the most small creatures, or whose board already has slime. The -1/-1 counter stacks with Toxrill's static, so X/1s and slimed creatures die now and give you Slugs"}, {"when": "Massacre Girl is out", "get": "Massacre Girl, Known Killer", "why": "Every creature dropped to 0 toughness draws you a card, so aim at the widest board"}, {"when": "Never target yourself", "get": null, "why": "Your 1/1 Slugs (and Blood Artist) die to it"}, {"when": "Later turns: activate", "get": "Toxrill, the Corrosive", "why": "{4},{T}: proliferate twice = two extra slime counters on every enemy creature. Pick only enemy creatures (and Midnight Clock if you want the refill sooner)"}]}]}, {"title": "Slug economy & death engine", "desc": "Corpses in, cards, mana and edicts out", "cards": [{"n": "Grave Pact", "mv": 4, "new": true, "tags": "slugs wipes", "tip": "Each Slug you sacrifice = each opponent sacrifices a creature. Their slimed creature dies → you get a new Slug. The lock"}, {"n": "Skullclamp", "mv": 1, "tags": "slugs value", "tip": "Equip a 1/1 Slug and it dies: 1 mana, draw 2 (and a Grave Pact edict). The best card in the deck"}, {"n": "Morbid Opportunist", "mv": 3, "new": true, "tags": "slugs value", "tip": "First death each turn (anyone's) draws a card"}, {"n": "Blood Artist", "mv": 2, "tags": "slugs drain", "tip": "Every death, anywhere: drain 1"}, {"n": "Syr Konrad, the Grim", "mv": 5, "tags": "slugs drain", "tip": "ANY other creature dying pings each opponent; his mill fills graveyards for Primordial"}, {"n": "Black Market", "mv": 5, "tags": "slugs", "tip": "A black mana per creature death, forever. Pays for Torment/Exsanguinate"}]}, {"title": "Board control", "desc": "Wipes and removal that leave something behind on your side", "cards": [{"n": "Damnation", "mv": 4, "tags": "wipes drain", "tip": "Clean reset. Cast it BEFORE Toxrill, or accept recasting him"}, {"n": "Toxic Deluge", "mv": 3, "tags": "wipes drain", "tip": "Pay life, not mana. Scales to exactly what needs to die", "guide": [{"when": "Before Toxrill", "get": null, "why": "Pay X = their biggest toughness you need gone. Leaves the table empty for him to land into"}, {"when": "Toxrill already out", "get": null, "why": "Their creatures are already shrunk by slime, so a small X does it. Remember he's a 7-toughness creature too (X ≥ 7 kills him)"}, {"when": "Massacre Girl out", "get": "Massacre Girl, Known Killer", "why": "Deluge kills by toughness, so every enemy death draws a card"}]}, {"n": "Polymorphist's Jest", "mv": 3, "tags": "wipes", "tip": "Their board = 1/1 Frogs; one slime counter finishes them. A secret wipe", "guide": [{"when": "Target", "get": null, "why": "The opponent with the biggest board, or the one about to swing at you"}, {"when": "Best timing", "get": "Toxrill, the Corrosive", "why": "In response to Toxrill's end-step trigger: the Frogs get slime and die, and you get a Slug each. Anything that already had slime dies right away"}, {"when": "Combat trick", "get": null, "why": "Mid-combat it turns their attackers into 1/1s with no abilities, a blowout against one big threat"}]}, {"n": "Massacre Wurm", "mv": 6, "tags": "wipes drain", "tip": "-2/-2 wipes the small stuff, then 2 life per death"}, {"n": "Cyclonic Rift", "mv": 2, "tags": "wipes", "tip": "One-sided reset; Game Changer", "guide": [{"when": "Early, one problem", "get": null, "why": "2 mana: bounce one nonland permanent you don't control"}, {"when": "Late, 7 mana", "get": "Toxrill, the Corrosive", "why": "Overload at the end of the opponent's turn right before yours: everything they own goes home and tokens die. Note bounced creatures come back without slime"}, {"when": "Grave Pact + Slugs out", "get": null, "why": "Often better to keep killing with the Pact loop than reset the counters"}]}, {"n": "Go for the Throat", "mv": 2, "new": true, "tags": "protect", "tip": "Premium 2-mana kill spell (not artifact creatures)"}, {"n": "Infernal Grasp", "mv": 2, "new": true, "tags": "protect", "tip": "Kill anything for 2 mana + 2 life"}, {"n": "Deadly Rollick", "mv": 4, "new": true, "tags": "protect", "tip": "FREE exile while Toxrill is on the battlefield. Answers indestructible/recursion"}, {"n": "Reality Shift", "mv": 2, "tags": "protect", "tip": "Exile at instant speed; answers indestructible/recursion"}, {"n": "Feed the Swarm", "mv": 2, "tags": "protect", "tip": "Black's rare enchantment answer"}, {"n": "Plaguecrafter", "mv": 3, "tags": "wipes", "tip": "Edict that gets around hexproof and hits planeswalkers. Sacrifice a Slug yourself (that also triggers Grave Pact)"}, {"n": "Sheoldred's Edict", "mv": 2, "new": true, "tags": "wipes", "tip": "Each opponent sacrifices: you pick nontoken, token, or planeswalker", "guide": [{"when": "Default: real threats", "get": null, "why": "Nontoken creature: Toxrill melts tokens anyway, so this hits the cards slime is slow on"}, {"when": "Planeswalker ticking up", "get": null, "why": "Planeswalker mode. Your creatures rarely attack, so this is your main walker answer"}, {"when": "Token army before Toxrill lands", "get": null, "why": "Token mode buys a turn, but a wipe or Jest is usually better"}]}]}, {"title": "Counter wall", "desc": "Protection for the tap-out turns", "cards": [{"n": "Counterspell", "mv": 2, "tags": "protect"}, {"n": "Arcane Denial", "mv": 2, "tags": "protect", "tip": "The opponent's 2 cards are a fair price at instant speed"}, {"n": "Negate", "mv": 2, "tags": "protect"}, {"n": "Swan Song", "mv": 1, "tags": "protect", "tip": "1 mana for the turn you cast Toxrill"}, {"n": "An Offer You Can't Refuse", "mv": 1, "tags": "protect"}, {"n": "Fierce Guardianship", "mv": 3, "new": true, "tags": "protect", "tip": "FREE counter for a noncreature spell once Toxrill is out. It can't be free while he's still on the stack. Game Changer"}]}, {"title": "Card advantage", "desc": "Win the draw race while the melt does its work", "cards": [{"n": "Demonic Tutor", "mv": 2, "new": true, "tags": "value", "tip": "Any card for 2 mana. See the Playbook. Game Changer", "guide": [{"when": "Overrun / behind on board", "get": "Toxic Deluge", "why": "Reset first, then land Toxrill into an empty table"}, {"when": "Toxrill out, board stable", "get": "Grave Pact", "why": "Every Slug you sacrifice becomes an edict for each opponent. This is the lock"}, {"when": "Toxrill out, no Pact draw engine yet", "get": "Skullclamp", "why": "1 mana per Slug: draw 2"}, {"when": "Ahead, mana banked", "get": "Exsanguinate", "why": "Black Market/rocks = huge X; drains the whole table and you gain it all"}, {"when": "Need protection for a key turn", "get": "Fierce Guardianship", "why": "Free once Toxrill is out"}, {"when": "Never get Toxrill", "get": null, "why": "He's your commander. Recast him from the command zone"}]}, {"n": "Rhystic Study", "mv": 3, "tags": "value", "tip": "The classic tax. Game Changer"}, {"n": "Mystic Remora", "mv": 1, "tags": "value", "tip": "Turn 1–4 powerhouse; let it go when the upkeep gets pricey"}, {"n": "Phyrexian Arena", "mv": 3, "new": true, "tags": "value", "tip": "Extra card every upkeep for 1 life"}, {"n": "Faerie Mastermind", "mv": 2, "new": true, "tags": "value", "tip": "Flash flier; draws when an opponent draws their 2nd card each turn"}, {"n": "Massacre Girl, Known Killer", "mv": 4, "new": true, "tags": "slime value", "tip": "Draws whenever an enemy creature dies with toughness <1. Toxrill's melt counts, kill spells don't. Wither on your Slugs"}, {"n": "Baleful Strix", "mv": 2, "tags": "value protect", "tip": "Cantrip flying deathtouch wall"}, {"n": "Night's Whisper", "mv": 2, "tags": "value"}, {"n": "Brainstorm", "mv": 1, "tags": "value"}, {"n": "Fact or Fiction", "mv": 4, "new": true, "tags": "value steal", "tip": "Instant draw that also fills graveyards for Primordial"}, {"n": "Dig Through Time", "mv": 8, "new": true, "tags": "value", "tip": "Delve: usually UU for the two best of seven"}]}, {"title": "Drain wincons", "desc": "Mana-hungry finishers. Black Market pays the bill", "cards": [{"n": "Gray Merchant of Asphodel", "mv": 5, "tags": "drain", "tip": "Devotion drain. BB costs across the deck add up fast"}, {"n": "Exsanguinate", "mv": "X+2", "tags": "drain"}, {"n": "Torment of Hailfire", "mv": "X+2", "tags": "drain", "tip": "X=10 off a Black Market bank ends the table"}]}, {"title": "Their stuff, your board", "desc": "Shop in the graveyards you filled", "cards": [{"n": "Sepulchral Primordial", "mv": 7, "tags": "steal", "tip": "Returns the best creature from EACH opponent's graveyard"}, {"n": "Puppeteer Clique", "mv": 5, "tags": "steal", "tip": "Borrow one of theirs with haste, twice (persist)"}]}, {"title": "Ramp & utility", "desc": "Reaching 7 mana on time, then keeping Toxrill alive", "cards": [{"n": "Sol Ring", "mv": 1, "new": true, "tip": "Turn-1 Sol Ring = Toxrill on 5"}, {"n": "Arcane Signet", "mv": 2}, {"n": "Dimir Signet", "mv": 2}, {"n": "Talisman of Dominance", "mv": 2}, {"n": "Fellwar Stone", "mv": 2}, {"n": "Mind Stone", "mv": 2}, {"n": "Thought Vessel", "mv": 2}, {"n": "Wayfarer's Bauble", "mv": 1}, {"n": "Skyclave Relic", "mv": 3}, {"n": "Solemn Simulacrum", "mv": 4, "tags": "value"}, {"n": "Midnight Clock", "mv": 3, "new": true, "tags": "value", "tip": "Rock now, free new hand at 12 o'clock"}, {"n": "Dark Ritual", "mv": 1, "tip": "Toxrill (or Grave Pact) a turn early"}, {"n": "Lightning Greaves", "mv": 2, "tags": "protect"}, {"n": "Swiftfoot Boots", "mv": 2, "tags": "protect"}, {"n": "Pithing Needle", "mv": 1, "tags": "protect", "tip": "Name the scariest activated ability at the table"}, {"n": "Malakir Rebirth", "name": "Malakir Rebirth // Malakir Mire", "mv": 1, "tags": "protect", "tip": "1-mana Toxrill insurance that's a land when you don't need it", "guide": [{"when": "Short on lands (turns 1–5)", "get": null, "why": "Play it as Malakir Mire, a tapped Swamp. Hitting land drops matters more"}, {"when": "Toxrill targeted by a kill spell", "get": "Toxrill, the Corrosive", "why": "Cast in response. When he dies, leave him in the graveyard (don't send him to the command zone) and he comes back tapped, no commander tax"}, {"when": "Grave Pact out", "get": null, "why": "Rebirth on any creature that's about to die: you get it back AND the Pact triggers"}]}]}]}
